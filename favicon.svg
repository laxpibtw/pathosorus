<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fond avec coins arrondis style Apple Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#glowGrad)" stroke-width="6" />

  <!-- Halo de lumiere central -->
  <circle cx="256" cy="240" r="160" fill="#14b8a6" opacity="0.12" filter="url(#glow)" />

  <!-- Emoji T-Rex Stylise -->
  <text x="256" y="215" font-size="150" text-anchor="middle" dominant-baseline="central">🦖</text>

  <!-- Symbole Microscope & Diagnostic Stylise -->
  <g transform="translate(256, 330) scale(1.3)" filter="url(#glow)">
    <!-- Base du microscope -->
    <rect x="-45" y="35" width="90" height="12" rx="6" fill="url(#tealGrad)" />
    <path d="M -15,35 L -15,10 C -15,-10 15,-10 15,10 L 15,35" fill="none" stroke="url(#tealGrad)" stroke-width="7" stroke-linecap="round" />
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#tealGrad)" stroke-width="6" />
    <line x1="-25" y1="-20" x2="25" y2="-20" stroke="url(#tealGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Texte de marque bas -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="url(#tealGrad)" text-anchor="middle" letter-spacing="2">PATHOSORUS</text>
</svg>